# Game events use a WebSocket under /api/: pass the upgrade through, and keep other requests'
# connections as they were.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
# Docker gives the api container a new address whenever it is recreated or restarted, and this
# container may outlive it. Ask Docker's DNS again every 10 s instead of keeping the address
# found at startup, which may by then belong to another container or to none.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream api {
  zone api 64k;
  server api:8000 resolve;
}
# Anyone may ask for a Google sign-in challenge, and each one is a database row kept for a day, so
# each visitor may ask for 10 a minute, after a first burst of 20. On the live site only the host
# proxy reaches this container, and it sets X-Forwarded-For to the visitor's address alone;
# requests without the header (local runs, the browser tests) are not limited.
limit_req_zone $http_x_forwarded_for zone=google_start:1m rate=10r/m;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # The live site mounts an allow list here (only its host proxy and loopback); none locally.
  include /etc/nginx/access.d/*.conf;
  # No location below uses add_header, so every response inherits these. Google Identity
  # Services needs its script, stylesheet and button frame, and the page's origin as referrer.
  # The installed app (v0.3.0) adds its service worker and manifest from this origin only, which
  # also keeps workers made from blob: addresses refused.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # The API believes this header only from this proxy's address (CD_TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A game's WebSocket may sit quiet while a player thinks; the API pings it every 20 s.
    proxy_read_timeout 1h;
  }
  location = /api/v1/auth/google/start {
    limit_req zone=google_start burst=20 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many_challenges;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  # The API's error shape, so the sign-in page can say why.
  location @too_many_challenges {
    default_type application/json;
    return 429 '{"code":"too_many_attempts","message":"Too many sign-in attempts from this address. Try again in a minute.","request_id":""}';
  }
  # A problem report (v0.4.1) may carry a screenshot of up to 5 MB, about 7 MB in base64. Every
  # other request keeps nginx's 1 MB.
  location = /api/v1/reports {
    client_max_body_size 8m;
    error_page 413 = @report_too_large;
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location @report_too_large {
    default_type application/json;
    return 413 '{"code":"request_too_large","message":"The report is too large to send. Choose a smaller screenshot.","request_id":""}';
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  # The service worker and the manifest are checked for updates on every visit (no-cache); a
  # missing one, or a missing icon, is a 404 rather than the page.
  location = /sw.js { expires -1; try_files $uri =404; }
  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }
  location /brand/ { expires 7d; try_files $uri =404; }
  # The Planeswalker portraits (v0.3.1), fetched when shown rather than precached.
  location /portraits/ { expires 7d; try_files $uri =404; }
  # The shop's pack pictures, set symbols and Leng's painting (v0.4.3), likewise. A missing
  # picture is a 404, so the shop draws the pack instead.
  location /packs/ { expires 7d; try_files $uri =404; }
  location /sets/ { expires 7d; try_files $uri =404; }
  location /shop/ { expires 7d; try_files $uri =404; }
  # The main menu's tile paintings (v0.5.1), the owner's.
  location /menu/ { expires 7d; try_files $uri =404; }
  # The public pages (v0.4.1): plain HTML for anyone, signed in or not, with JavaScript or
  # without, at addresses of their own (Google's consent screen names them). Each is one exact
  # file, never a directory, so nginx never answers with a redirect of its own; the service
  # worker leaves them to the network (src/pwa/swRules.ts).
  location = /about { expires -1; try_files /pages/about.html =404; }
  location = /privacy { expires -1; try_files /pages/privacy.html =404; }
  location = /terms { expires -1; try_files /pages/terms.html =404; }
  location /pages/ { expires -1; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}

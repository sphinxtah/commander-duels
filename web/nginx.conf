# Game events use a WebSocket under /api/: pass the upgrade through, and keep other requests'
# connections as they were.
map $http_upgrade $connection_upgrade {
  default upgrade;
  "" close;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  # No location below uses add_header, so every response inherits these. Google Identity
  # Services needs its script, stylesheet and button frame, and the page's origin as referrer.
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://accounts.google.com/gsi/style; frame-src https://accounts.google.com/gsi/; img-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # The API believes this header only from this proxy's address (CD_TRUSTED_PROXIES).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A game's WebSocket may sit quiet while a player thinks; the API pings it every 20 s.
    proxy_read_timeout 1h;
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location / { expires -1; try_files $uri $uri/ /index.html; }
}

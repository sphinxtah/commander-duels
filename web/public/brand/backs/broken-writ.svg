      <path d="M-62 -6 A62 62 0 0 1 52 -38 L18 -6 L34 12 Z" fill="#8f1d1d" stroke="#4d0c0c" stroke-width="4"/>
      <path d="M-58 22 A62 62 0 0 0 60 10 L26 20 L10 0 Z" fill="#7a1717" stroke="#4d0c0c" stroke-width="4" transform="translate(6 10) rotate(8)"/>
      <circle r="26" fill="none" stroke="#c7432f" stroke-width="3" opacity="0.6"/>
    </g>
  </g>
  <g fill="url(#bronze)">
    <path d="M315 70 l12 22 -12 22 -12 -22z"/>
    <path d="M315 766 l12 22 -12 22 -12 -22z"/>

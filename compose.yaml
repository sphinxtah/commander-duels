name: commander-duels
services:
  db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: commander
      POSTGRES_PASSWORD: commander
      POSTGRES_DB: commander
    # Host-side tests and Alembic only; the stack itself never uses it. Windows can reserve 5432
    # after a restart (WinNAT's excluded port range): set CD_DB_PORT in .env to move it.
    ports: ["127.0.0.1:${CD_DB_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commander -d commander"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: &api_environment
      CD_DATABASE_URL: postgresql+psycopg://commander:commander@db:5432/commander
      CD_ENGINE_URL: http://engine:8090
      CD_PUBLIC_URL: http://localhost:8080
      # Set CD_GOOGLE_CLIENT_ID in .env (a Web OAuth client ID; public, no secret) to enable
      # Google sign-in. CD_SIGNUP_POLICY=approval makes new accounts wait for approval.
      CD_GOOGLE_CLIENT_ID: ${CD_GOOGLE_CLIENT_ID:-}
      CD_SIGNUP_POLICY: ${CD_SIGNUP_POLICY:-open}
      # The web proxy is the only trusted proxy. Docker Desktop delivers this computer's browser
      # requests from the network gateway, and the ports are published on 127.0.0.1 only, so the
      # gateway is this computer: SysOp's development network.
      CD_TRUSTED_PROXIES: 172.30.233.10/32
      CD_SYSOP_NETWORKS: 172.30.233.1/32
      # Shared with the engine; set it in .env (at least 32 random characters). Empty turns
      # games off.
      CD_ENGINE_SERVICE_TOKEN: ${CD_ENGINE_SERVICE_TOKEN:-}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *api_environment
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      engine: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: {context: ., dockerfile: api/Dockerfile}
    environment: *api_environment
    command: ["python", "-m", "catalog.worker"]
    stop_grace_period: 10s
    depends_on:
      migrate: {condition: service_completed_successfully}
  engine:
    build: {context: ., dockerfile: engine/Dockerfile}
    # Internal only: no published port, and the web proxy forwards nothing to it.
    expose: ["8090"]
    environment:
      # Development-only POST /v1/bot_match and games, reachable from other Compose services.
      CD_ENGINE_DEV_ENDPOINTS: "true"
      # The API's games: only requests carrying this token reach them.
      CD_ENGINE_SERVICE_TOKEN: ${CD_ENGINE_SERVICE_TOKEN:-}
      # One match peaks near 200 MB of heap; the limit leaves room for metaspace and threads.
      # XMage opens its card database with H2 AUTO_SERVER, which starts a TCP listener; bind it to
      # loopback so other services cannot reach it.
      JDK_JAVA_OPTIONS: "-Xms256m -Xmx768m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError -Dh2.bindAddress=127.0.0.1"
    mem_limit: 1536m
    healthcheck:
      # Ready once the card database is open (about 1 s; a stale database is rebuilt in ~30 s).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8090/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 90s
      start_interval: 2s
  web:
    build: {context: ., dockerfile: web/Dockerfile}
    ports: ["127.0.0.1:8080:8080"]
    networks:
      default: {ipv4_address: 172.30.233.10}
    depends_on:
      api: {condition: service_healthy}
networks:
  default:
    ipam:
      config: [{subnet: 172.30.233.0/24, gateway: 172.30.233.1}]
volumes:
  postgres_data:

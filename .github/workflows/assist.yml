name: Work-branch assist
# Temporary, for v0.8.4's work branch only (removed before the merge): regenerates the contracts and
# formats what changed, commits that back, then runs the quick checks and keeps their logs.
on:
  push:
    branches: [tutorial-0.8.4]
permissions: {contents: write}
concurrency: {group: assist, cancel-in-progress: true}
jobs:
  assist:
    if: "!startsWith(github.event.head_commit.message, 'assist:')"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CD_TEST_POSTGRES_URL: postgresql+psycopg://commander:commander@localhost:5432/commander
    services:
      postgres:
        image: postgres:17.5-alpine
        env: {POSTGRES_USER: commander, POSTGRES_PASSWORD: commander, POSTGRES_DB: commander}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commander"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 50}
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24.19.0'}
      - uses: pnpm/action-setup@v6
        with: {version: '11.25.0'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: pnpm install --frozen-lockfile
      - name: Regenerate and format
        run: |
          ruff check --fix api catalog tests scripts || true
          ruff format api catalog tests scripts
          python scripts/export_contracts.py && pnpm contracts
          changed=$(git diff --name-only origin/main...HEAD -- web | grep -E '\.(ts|tsx|css)$' | grep -v generated || true)
          if [ -n "$changed" ]; then (cd web && echo "$changed" | sed 's#^web/##' | xargs -r pnpm exec prettier --write --ignore-unknown); fi
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "assist: regenerate contracts and format"
            git push
          fi
      - name: Checks
        run: |
          mkdir -p assist-logs
          set +e
          (ruff check api catalog tests scripts && ruff format --check api catalog tests scripts) > assist-logs/ruff.txt 2>&1; echo "ruff $?" >> assist-logs/status.txt
          mypy > assist-logs/mypy.txt 2>&1; echo "mypy $?" >> assist-logs/status.txt
          pytest -q -x --no-header -p no:cacheprovider > assist-logs/pytest.txt 2>&1; echo "pytest $?" >> assist-logs/status.txt
          alembic upgrade head > assist-logs/alembic.txt 2>&1 && alembic check >> assist-logs/alembic.txt 2>&1; echo "alembic $?" >> assist-logs/status.txt
          (cd web && pnpm exec tsc -b) > assist-logs/tsc.txt 2>&1; echo "tsc $?" >> assist-logs/status.txt
          pnpm test > assist-logs/vitest.txt 2>&1; echo "vitest $?" >> assist-logs/status.txt
          pnpm build > assist-logs/build.txt 2>&1; echo "build $?" >> assist-logs/status.txt
          cat assist-logs/status.txt
          for failed in $(grep -v ' 0$' assist-logs/status.txt | cut -d' ' -f1); do
            echo "::group::$failed"; grep -v '^\s*$' "assist-logs/$failed.txt" | tail -n 120; echo "::endgroup::"
          done
          ! grep -v ' 0$' assist-logs/status.txt
      # The welcome's screenshots, on demand: a commit whose message says [shots].
      - name: Welcome screenshots
        if: always() && contains(github.event.head_commit.message, '[shots]')
        run: |
          pnpm --dir web exec playwright install --with-deps chromium
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$password"
          printf '%s\n' "$password" | python -m api.cli sysop-password --stdin
          python scripts/load_fixture_catalog.py
          CD_E2E_WELCOME_SHOTS=1 CD_E2E_SYSOP_PASSWORD="$password" \
            pnpm --dir web exec playwright test e2e/welcome-shots.spec.ts --reporter=line || true
          ls -la web/test-results/welcome || true
          python scripts/welcome_shots.py web/test-results/welcome || true
          if [ -n "$(git status --porcelain web/public/welcome)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/public/welcome
            git commit -m "assist: the welcome's screenshots, taken from the game"
            git pull --rebase && git push
          fi
      - if: always()
        uses: actions/upload-artifact@v7
        with: {name: assist-logs, path: assist-logs, retention-days: 3}

name: Framework checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      CD_TEST_POSTGRES_URL: postgresql+psycopg://commander:commander@localhost:5432/commander
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_USER: commander
          POSTGRES_PASSWORD: commander
          POSTGRES_DB: commander
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commander"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v7
        with: {node-version: '24.19.0'}
      - uses: pnpm/action-setup@v6
        with: {version: '11.25.0'}
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check api catalog tests scripts && ruff format --check api catalog tests scripts && mypy && pytest
      - run: alembic upgrade head && alembic check
      - run: pnpm install --frozen-lockfile
      - run: python scripts/export_contracts.py && pnpm contracts && git diff --exit-code -- contracts/openapi.json web/src/generated/api.d.ts
      - run: pnpm test && pnpm build
      - run: pnpm --dir web exec playwright install --with-deps chromium
      # SysOp for the browser journeys: a throwaway password for this run's database only.
      - run: |
          password="$(python -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$password"
          echo "CD_E2E_SYSOP_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s\n' "$password" | python -m api.cli sysop-password --stdin
      - run: pnpm test:e2e
      # The engine image is built (with its XMage cache) by the engine job.
      - run: docker compose config --quiet && docker compose build migrate api worker web
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # XMage layers depend only on engine/xmage (the pin, build script and patches), so they come
      # from the Actions cache unless the pin changes. The build runs Maven and the JUnit suite.
      - name: Build engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: engine/Dockerfile
          tags: commander-duels-engine:latest
          load: true
          cache-from: type=gha,scope=engine
          cache-to: type=gha,scope=engine,mode=max
      - name: Engine smoke test in Compose
        run: |
          docker compose up -d --wait --no-build --no-deps engine
          docker compose exec -T engine curl -fsS http://localhost:8090/health
          docker compose exec -T engine curl -fsS -X POST -d '{"seed": 1}' http://localhost:8090/v1/bot_match \
            | python3 -c "import json, sys; r = json.load(sys.stdin); print(r['result'], r['turns'], r['duration_ms']); sys.exit(r['result'] != 'completed')"
          # Scripted human seats play a Legacy game and a four-seat Commander game (two humans, two
          # bots) through the seat API; every payload is checked and validated against the seat-view
          # contract. The engine publishes no port, so the client shares its network namespace.
          docker run --rm --network "container:$(docker compose ps -q engine)" -v "$PWD:/w:ro" -w /w python:3.12.10-slim \
            sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore --no-deps jsonschema==4.23.0 \
              jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.9.1 attrs==26.1.0 typing_extensions==4.16.0 \
              && python scripts/engine_human_game.py --url http://localhost:8090 --schema contracts/engine-seat-view.schema.json --quiet --skill 1 \
              && python scripts/engine_human_game.py --url http://localhost:8090 --schema contracts/engine-seat-view.schema.json --quiet --skill 1 \
                --format commander --seats human,human,bot,bot --turn-cap 24"
          docker compose down
      # SysOp plays a Legacy and a Commander practice game through the API and its WebSocket: the
      # engine's service routes, seat ownership, the controller lease, a resend, the inspection
      # view and the recorded result. A throwaway service token and SysOp password for this run.
      - name: Practice games through the API
        run: |
          token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          export CD_ENGINE_SERVICE_TOKEN="$token"
          docker compose build migrate api
          docker compose up -d --wait --no-build db migrate api engine
          printf '%s\n' "$password" | docker compose exec -T api python -m api.cli sysop-password --stdin
          # Host networking: the client reaches the API's published port from this machine, which
          # the API sees as the Compose gateway, SysOp's network.
          docker run --rm --network host -e CD_SYSOP_PASSWORD="$password" -v "$PWD:/w:ro" -w /w python:3.12.10-slim \
            sh -c "pip install -q --disable-pip-version-check --root-user-action=ignore --no-deps websockets==17.2 jsonschema==4.23.0 \
              jsonschema-specifications==2025.9.1 referencing==0.37.0 rpds-py==2026.9.1 attrs==26.1.0 typing_extensions==4.16.0 \
              && python scripts/api_practice_game.py --url http://127.0.0.1:8000 --origin http://localhost:8080 --schemas contracts --quiet \
              && python scripts/api_practice_game.py --url http://127.0.0.1:8000 --origin http://localhost:8080 --schemas contracts --quiet \
                --format commander --bots 2 --turn-cap 24"
          docker compose down
      # The game screen (v0.1.0): Legacy games played to the end by mouse and by keyboard, a
      # four-player Commander table, and a second tab with a lost reply, in Chromium through the
      # web proxy against the engine. Every WebSocket frame is checked for concealed cards.
      - name: Practice games in the browser
        run: |
          token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')"
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          export CD_ENGINE_SERVICE_TOKEN="$token"
          docker compose build migrate api web
          docker compose up -d --wait --no-build db migrate api engine web
          printf '%s\n' "$password" | docker compose exec -T api python -m api.cli sysop-password --stdin
          # Host networking: the browser reaches the web proxy's published port from this machine,
          # which the API sees as the Compose gateway, SysOp's network.
          docker run --rm --network host --ipc=host -e CI=1 -e CD_BROWSER_URL=http://localhost:8080 \
            -e CD_E2E_GAMES=1 -e CD_E2E_SYSOP_PASSWORD="$password" -v "$PWD:/w" -w /w \
            mcr.microsoft.com/playwright:v1.64.1-noble sh -c "corepack enable \
              && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm install --frozen-lockfile --reporter=silent \
              && pnpm --dir web exec playwright test e2e/game.spec.ts --reporter=line"
          docker compose down
  # Images for the live site, once both jobs pass: every push to main as sha-<commit> and main,
  # every version tag as its version (v0.1.0 -> 0.1.0). deploy/push.sh deploys one by its tag.
  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [verify, engine]
    runs-on: ubuntu-24.04
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - name: Image tags
        id: tags
        run: |
          base=ghcr.io/sphinxtah/commander-duels
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then label="${GITHUB_REF#refs/tags/v}"; else label=main; fi
          for image in api web engine; do
            echo "$image=$base/$image:sha-${GITHUB_SHA::12},$base/$image:$label" >> "$GITHUB_OUTPUT"
          done
      - name: Publish the API image (API, migrations and worker)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.api }}
          labels: org.opencontainers.image.source=https://github.com/sphinxtah/commander-duels
      - name: Publish the web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.web }}
          labels: org.opencontainers.image.source=https://github.com/sphinxtah/commander-duels
      # The engine job's cache holds every layer of this commit's engine build.
      - name: Publish the engine image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: engine/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.engine }}
          labels: org.opencontainers.image.source=https://github.com/sphinxtah/commander-duels
          cache-from: type=gha,scope=engine

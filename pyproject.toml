[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-duels"
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.146.0", "uvicorn==0.54.0", "pydantic-settings==2.16.0",
  "SQLAlchemy==2.1.5", "alembic==1.20.0", "psycopg[binary]==3.3.6", "httpx==0.28.1"
]
[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.12", "mypy==1.15.0", "jsonschema==4.23.0"]
[tool.setuptools.dynamic]
version = {file = "VERSION"}
[tool.setuptools.packages.find]
include = ["api*", "catalog*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.12"
strict = true
packages = ["api", "catalog"]

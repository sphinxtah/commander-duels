# XMage logs through log4j 1.x (reload4j). Its AI writes search traces at INFO, so only warnings and
# errors are shown; they include XMage's own "AI player thinks too long" reports.
log4j.rootLogger=WARN, console
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p [%t] %c{1} - %m%n
